theme: [flatly, _quarto/i2ml_theme.scss]
format:
  html:
    toc: true
    code-fold: false
    mathspec: true
    latex_engine: pdflatex
    embed-resources: true
    css: _quarto/styles.css
    format-links: false
  pdf:
    include-in-header:
      file: _quarto/pdf-preamble.tex
filters:
  - _quarto/indent_filter.lua
  - _quarto/pagebreak_filter.lua
jupyter: python3
notebook-links: global
knitr:
  opts_chunk:
    fig.retina: 1.5  # knitr figures at 1.5x their display size (default 2x): ~40% smaller, same size on the page

