subtitle: "[Introduction to Machine Learning](https://slds-lmu.github.io/i2ml/)"
theme: [flatly, _quarto/i2ml_theme.scss]
format:
  html:
    toc: true
    embed-resources: true
    css: _quarto/styles.css
    format-links: false
    # HTML only: as a global knitr option it would also reach the PDF, where knitr
    # then sizes the figures by their 300 dpi (a 5in figure becomes 15.6in wide)
    knitr:
      opts_chunk:
        fig.retina: 1.5  # knitr figures at 1.5x their display size (default 2x): ~40% smaller, same size on the page
  pdf:
    pdf-engine: pdflatex
    include-in-header:
      file: _quarto/pdf-preamble.tex
filters:
  - _quarto/indent_filter.lua
  - _quarto/pagebreak_filter.lua
notebook-links: global
